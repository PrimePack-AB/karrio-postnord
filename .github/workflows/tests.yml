name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check out the fork SDK into the workspace
        uses: actions/checkout@v5
        with:
          repository: Joaqim/karrio
          # develop is regenerated and force-pushed, so its shas are not
          # durable; a later step checks the required SDK surface instead.
          ref: develop
          path: karrio-sdk
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the fork SDK and the connector
        run: pip install -e karrio-sdk/modules/sdk -e .
      - name: Check the SDK provides the document-stamping surface
        run: |
          python - <<'EOF'
          import sys
          import attr
          import karrio.lib as lib
          from karrio.core.metadata import PluginMetadata

          fields = attr.fields_dict(PluginMetadata)
          missing = [
              f"PluginMetadata.{name}"
              for name in ("stamp_seeds", "document_sections")
              if name not in fields
          ] + [
              f"karrio.lib.{name}"
              for name in (
                  "StampSeed",
                  "StampPlacement",
                  "AnyOf",
                  "CustomsComposition",
                  "classify_customs_composition",
              )
              if not hasattr(lib, name)
          ]
          if missing:
              sys.exit(
                  "Joaqim/karrio develop lacks the document-stamping SDK surface "
                  "this connector needs: " + ", ".join(missing)
              )
          EOF
      - name: Run the connector test suite
        run: python -m unittest discover -f -s tests
