[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karrio_postnord"
version = "2026.10.4"
description = "Karrio Connector Plugin - PostNord Shipping Extension"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0"
authors = [
    {name = "PrimePack AB"}
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "karrio",
]

[project.urls]
Homepage = "https://github.com/PrimePack-AB/karrio-postnord"

[project.entry-points."karrio.plugins"]
postnord = "karrio.plugins.postnord:METADATA"

[tool.primepack]
# The Joaqim/karrio fork snapshot tag each release is tested against.
karrio-ref = "snapshot-2026.10.19.1"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["karrio*"]
exclude = ["tests.*", "tests"]
namespaces = true
[tool.setuptools.exclude-package-data]
"*" = ["__init__.pyi"]